### 1.2 Queries

#### `uploadStatus`
Checks the progress and missing chunk numbers of an active upload session for resuming interrupted uploads.

```graphql
query UploadStatus($uploadId: String!) {
  uploadStatus(uploadId: $uploadId) {
    success
    statusCode
    message
    timeStamp
    data {
      uploadId
      status
      totalParts
      completedParts
      missingParts
      expiresAt
    }
  }
}
```

---

#### `downloadUrl`
Generates a time-limited download URL with optional version renditions (original, thumbnail, optimized) and custom expiry.

```graphql
query DownloadUrl($mediaId: String!, $versionType: String, $expirySeconds: Int) {
  downloadUrl(mediaId: $mediaId, versionType: $versionType, expirySeconds: $expirySeconds) {
    success
    statusCode
    message
    timeStamp
    data {
      mediaId
      downloadUrl
      expiresInSeconds
      expiresAt
      contentType
    }
  }
}
```

---

#### `getMediaById`
Fetches a single media record by ID.

```graphql
query GetMediaById($mediaId: String!) {
  getMediaById(mediaId: $mediaId) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      mediaId
      fileName
      storageKey
      mimeType
      sizeBytes
      status
      isPublic
      versions {
        id
        versionType
        storageKey
        mimeType
        sizeBytes
      }
    }
  }
}
```

---

#### `getMyMedia`
Retrieves a paginated list of media files uploaded by the current authenticated user.

```graphql
query GetMyMedia($page: Int, $limit: Int) {
  getMyMedia(page: $page, limit: $limit) {
    success
    statusCode
    message
    timeStamp
    data {
      total
      page
      limit
      totalPages
      items {
        id
        mediaId
        fileName
        storageKey
        mimeType
        sizeBytes
        status
        isPublic
        createdAt
        updatedAt
      }
    }
  }
}
```

---

#### `getMyQuota`
Retrieves user storage quota and concurrent upload metrics.

```graphql
query GetMyQuota {
  getMyQuota {
    success
    statusCode
    message
    timeStamp
    data {
      userId
      usedBytes
      quotaBytes
      activeUploads
      maxConcurrent
    }
  }
}
```

