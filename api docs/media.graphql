## 2. Server-Sent Events (SSE) Progress & Status Stream

Real-time upload and processing updates streamed directly via HTTP Server-Sent Events (SSE):

### Endpoints:
1. **Specific Media Lifecycle:**
```http
GET /media/events/:mediaId
```

2. **Global Stream (All uploads & processing events):**
```http
GET /media/events
```

### Event Format:
```text
event: media_update
id: 01JBP8R3C8G2V...-1730379500000
data: {"mediaId":"01JBP8R3C8G2V...","status":"READY","progressPercent":100,"message":"Upload completed and verified successfully","timestamp":"2026-11-02T12:58:20.000Z"}
```
