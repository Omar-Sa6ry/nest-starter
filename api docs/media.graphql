#### `requestUploadUrl`
Generates a direct presigned PUT URL for files smaller than 50 MB, or automatically triggers multipart upload for files larger than 50 MB (up to 100 GB).

```graphql
mutation RequestUploadUrl($input: RequestUploadInput!) {
  requestUploadUrl(input: $input) {
    success
    statusCode
    message
    timeStamp
    data {
      mediaId
      uploadUrl
      uploadId
      storageKey
      isMultipart
      expiresInSeconds
      parts {
        partNumber
        uploadUrl
        presignedUrl
      }
    }
  }
}
```

*Variables:*
```json
{
  "input": {
    "fileName": "sample_video.mp4",
    "mimeType": "video/mp4",
    "sizeBytes": 10485760,
    "isPublic": false
  }
}
```

---

#### `initiateMultipartUpload`
Explicitly initiates a multipart upload for massive files (up to 100 GB), returning presigned URLs for each chunk (default 10 MB per part).

```graphql
mutation InitiateMultipartUpload($input: InitiateMultipartUploadInput!) {
  initiateMultipartUpload(input: $input) {
    success
    statusCode
    message
    timeStamp
    data {
      mediaId
      uploadId
      storageKey
      isMultipart
      expiresInSeconds
      parts {
        partNumber
        uploadUrl
        presignedUrl
      }
    }
  }
}
```

---

#### `completeMultipartUpload`
Finalizes the multipart upload after the client has uploaded all parts to S3/MinIO. Verifies object presence and content length using S3 `HeadObject`.

```graphql
mutation CompleteMultipartUpload($input: CompleteMultipartUploadInput!) {
  completeMultipartUpload(input: $input) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      mediaId
      fileName
      storageKey
      mimeType
      sizeBytes
      status
      isPublic
      createdAt
      updatedAt
    }
  }
}
```

*Variables:*
```json
{
  "input": {
    "mediaId": "01JBP8R3C8G2V...",
    "parts": [
      { "partNumber": 1, "eTag": "\"d41d8cd98f00b204e9800998ecf8427e\"" },
      { "partNumber": 2, "eTag": "\"098f6bcd4621d373cade4e832627b4f6\"" }
    ]
  }
}
```

