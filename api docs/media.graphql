#### `deleteMedia`
Deletes a media item and removes the underlying object from storage.

```graphql
mutation DeleteMedia($mediaId: String!) {
  deleteMedia(mediaId: $mediaId) {
    success
    statusCode
    message
    timeStamp
  }
}
```

