## 2. Server-Sent Events (SSE) Progress & Status Stream

Instead of WebSockets, clients can listen to real-time verification and upload progress over HTTP Server-Sent Events:

### Endpoint:
```http
GET /media/events/:mediaId
```

### Event Format:
```text
event: media_update
id: 01JBP8R3C8G2V...-1730379500000
data: {"mediaId":"01JBP8R3C8G2V...","status":"READY","progressPercent":100,"message":"Upload completed and verified successfully","timestamp":"2026-10-31T12:58:20.000Z"}
```

