#`createUploadSession` (Recommended for Resumable/Chunked Uploads)
Initializes a resumable upload session with chunking and presigned URLs for each part.

```graphql
mutation CreateUploadSession($input: CreateUploadSessionInput!) {
  createUploadSession(input: $input) {
    success
    statusCode
    message
    timeStamp
    data {
      mediaId
      uploadId
      uploadUrl
      partSize
      totalParts
      expiresAt
      storageKey
      isMultipart
      expiresInSeconds
      parts {
        partNumber
        uploadUrl
        presignedUrl
      }
    }
  }
}
```

*Variables:*
```json
{
  "input": {
    "fileName": "sample_video.mp4",
    "contentType": "video/mp4",
    "size": 104857600,
    "checksum": "optional-sha256-hex"
  }
}
```

---

#### `completeUpload`
Completes a session-based resumable upload using the `uploadId` and the uploaded parts with their ETags.

```graphql
mutation CompleteUpload($input: CompleteUploadInput!) {
  completeUpload(input: $input) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      mediaId
      fileName
      storageKey
      mimeType
      sizeBytes
      status
    }
  }
}
```

*Variables:*
```json
{
  "input": {
    "uploadId": "s3-upload-id-string",
    "parts": [
      { "partNumber": 1, "eTag": "d41d8cd98f00b204e9800998ecf8427e" },
      { "partNumber": 2, "eTag": "098f6bcd4621d373cade4e832627b4f6" }
    ]
  }
}
```

---

#### `abortUpload`
Aborts an in-progress resumable upload session by `uploadId`.

```graphql
mutation AbortUpload($uploadId: String!) {
  abortUpload(uploadId: $uploadId) {
    success
    statusCode
    message
    timeStamp
  }
}
```

