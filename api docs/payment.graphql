# ==============================================================================
# Payment Module - GraphQL & REST Testing Documentation
# ==============================================================================
# All GraphQL requests below require Authorization Header:
# Headers: { "Authorization": "Bearer <YOUR_JWT_ACCESS_TOKEN>" }
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. INITIATE PAYMENT (Requires: Permission.PAYMENT_INITIATE)
# ------------------------------------------------------------------------------

# 1.1 Stripe Payment (Returns checkoutUrl)
mutation InitiateStripePayment {
  initiatePayment(
    input: {
      amount: 150.50
      currency: USD
      provider: STRIPE
      customer: {
        name: "Omar Sabry"
        email: "omar@example.com"
        phone: "+201000000000"
      }
      items: [
        {
          name: "Annual Subscription"
          quantity: 1
          unitAmount: 150.50
          description: "Full access license"
        }
      ]
      returnUrl: "https://myapp.com/payment/success"
      cancelUrl: "https://myapp.com/payment/cancel"
    }
  ) {
    statusCode
    message
    success
    timeStamp
    data {
      transactionId
      status
      providerTransactionId
      checkoutUrl
      referenceNumber
    }
  }
}

