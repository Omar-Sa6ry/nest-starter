# ------------------------------------------------------------------------------
# 2. VERIFY PAYMENT (Requires: Permission.PAYMENT_VIEW)
# ------------------------------------------------------------------------------
# Checks the payment status directly with the external provider gateway
mutation VerifyPayment {
  verifyPayment(transactionId: "374871411732254720") {
    statusCode
    message
    success
    timeStamp
    data {
      id
      userId
      amount
      currency
      provider
      status
      providerTransactionId
      referenceNumber
      createdAt
      updatedAt
    }
  }
}


# ------------------------------------------------------------------------------
# 3. GET PAYMENT TRANSACTION BY ID (Requires: Permission.PAYMENT_VIEW)
# ------------------------------------------------------------------------------
query GetPaymentTransaction {
  getPaymentTransaction(id: "374871411732254720") {
    statusCode
    message
    success
    timeStamp
    data {
      id
      userId
      amount
      currency
      provider
      status
      providerTransactionId
      checkoutUrl
      referenceNumber
      createdAt
      updatedAt
    }
  }
}


# ------------------------------------------------------------------------------
# 4. GET PAGINATED PAYMENT TRANSACTIONS (Requires: Permission.PAYMENT_VIEW)
# ------------------------------------------------------------------------------
query GetPaymentTransactions {
  getPaymentTransactions(page: 1, limit: 10) {
    statusCode
    message
    success
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        totalPages
        limit
        hasPreviousPage
        hasNextPage
        previousPage
        nextPage
      }
      items {
        id
        userId
        amount
        currency
        provider
        status
        providerTransactionId
        referenceNumber
        createdAt
        updatedAt
      }
    }
  }
}


# ------------------------------------------------------------------------------
# 5. REFUND PAYMENT (Requires: Permission.PAYMENT_MANAGE => Role.ADMIN)
# Note: The transaction status must be COMPLETED before it can be refunded.
# ------------------------------------------------------------------------------
mutation RefundPayment {
  refundPayment(
    input: {
      transactionId: "374871411732254720"
      amount: 50.00
      reason: "Customer requested partial refund"
    }
  ) {
    statusCode
    message
    success
    timeStamp
    data {
      id
      status
      amount
      currency
      provider
      updatedAt
    }
  }
}


