version: '3'

vars:
  ENV_DEV: environments/.env.development
  ENV_TEST: environments/.env.test
  ENV_STAGING: environments/.env.staging
  ENV_PROD: environments/.env.production
  APP_URL: http://localhost:3000
  COMPOSE_DEV: -f infrastructure/docker/development/docker-compose.yml
  COMPOSE_TEST: -f infrastructure/docker/test/docker-compose.yml
  COMPOSE_STAGING: -f infrastructure/docker/staging/docker-compose.yml
  COMPOSE_PROD: -f infrastructure/docker/production/docker-compose.yml

tasks:
  default:
    desc: Show all available tasks
    cmds:
      - task --list

  # Setup and Dependencies
  install:
    desc: Install backend dependencies (npm install)
    cmds:
      - npm install

  ncu:
    desc: Check for outdated packages without modifying package.json
    cmds:
      - npx npm-check-updates

  update:
    desc: Upgrade dependencies in package.json and install
    cmds:
      - npx npm-check-updates -u --target minor
      - npm install --legacy-peer-deps

  # Application Lifecycle
  dev:
    desc: Start backend in development watch mode
    cmds:
      - npm run start:dev

  build:
    desc: Build backend production bundle via Nest CLI
    cmds:
      - nest build

  deploy:
    desc: Deploy the application using Nest CLI deploy
    cmds:
      - nest deploy

  clean:
    desc: Remove build artifacts, coverage reports, and cache files
    cmds:
      - node -e "const fs=require('fs');for(const p of ['dist','coverage','tsconfig.build.tsbuildinfo'])fs.rmSync(p,{recursive:true,force:true})"

  start:
    desc: Start backend application using Nest CLI
    cmds:
      - nest start

  start:dev:
    desc: Start backend in watch mode (nest start --watch)
    cmds:
      - nest start --watch

  start:debug:
    desc: Start backend in debug watch mode (nest start --debug --watch)
    cmds:
      - nest start --debug --watch

  start:prod:
    desc: Run compiled production bundle with NODE_ENV=production
    env:
      NODE_ENV: production
    cmds:
      - node dist/main

  # Frontend Sub-application
  frontend:install:
    desc: Install dependencies for media-frontend
    dir: media-frontend
    cmds:
      - npm install

  frontend:dev:
    desc: Start Vite dev server for media-frontend
    dir: media-frontend
    cmds:
      - npm run dev

  frontend:build:
    desc: Build media-frontend production bundle
    dir: media-frontend
    cmds:
      - npm run build

  frontend:preview:
    desc: Preview built media-frontend production bundle
    dir: media-frontend
    cmds:
      - npm run preview

  frontend:typecheck:
    desc: Type check media-frontend via TypeScript compiler
    dir: media-frontend
    cmds:
      - npm run typecheck

  # Health and Metrics Inspection
  health:
    desc: Probe GET /health (Liveness and system process statistics)
    cmds:
      - curl -sS {{.APP_URL}}/health

  health:ready:
    desc: Probe GET /health/ready (PostgreSQL and Redis readiness check)
    cmds:
      - curl -sS {{.APP_URL}}/health/ready

  metrics:
    desc: Scrape Prometheus metrics output via GET /metrics
    cmds:
      - curl -sS {{.APP_URL}}/metrics

  # Code Quality and Linting
  lint:
    desc: Execute oxlint across src and test suites
    cmds:
      - npx oxlint src/ test/

  format:
    desc: Format TypeScript files using Prettier
    cmds:
      - npx prettier --write "src/**/*.ts" "test/**/*.ts"

  typecheck:
    desc: Type-check backend TypeScript code without emitting output
    cmds:
      - npx tsc --noEmit -p tsconfig.json

  # Testing Suites
  test:
    desc: Run unit and integration tests using Vitest
    cmds:
      - npx vitest run

  test:watch:
    desc: Run tests interactively in watch mode
    interactive: true
    cmds:
      - npx vitest

  test:cov:
    desc: Run unit tests with V8 code coverage report
    cmds:
      - npx vitest run --coverage

  test:debug:
    desc: Debug unit tests with inspect-brk flag
    cmds:
      - npx vitest --inspect-brk --no-file-parallelism

  test:e2e:
    desc: Run end-to-end tests against Docker test stack
    cmds:
      - task: docker:test:down
      - task: docker:test:up
      - npx vitest run --config ./vitest.config.e2e.ts
      - task: docker:test:down

  check:
    desc: Run fast checks (lint, typecheck, and unit tests without coverage threshold)
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  check:all:
    desc: Run full CI test suite (lint, typecheck, unit tests with coverage, and e2e tests)
    cmds:
      - task: lint
      - task: typecheck
      - task: test:cov
      - task: test:e2e

  # Docker: Development Environment
  docker:dev:up:
    desc: Spin up development stack (nginx, app, postgres, redis, prometheus, minio)
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} up -d --build

  docker:dev:down:
    desc: Tear down development stack
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} down

  docker:dev:logs:
    desc: Stream development app logs in real time
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} logs -f app

  docker:dev:rebuild:
    desc: Force rebuild development application container
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} down
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} up -d --build --force-recreate app

  # Docker: Test Environment
  docker:test:up:
    desc: Spin up isolated test stack (postgres and redis)
    cmds:
      - docker compose --env-file {{.ENV_TEST}} {{.COMPOSE_TEST}} up -d --remove-orphans postgres redis

  docker:test:down:
    desc: Tear down test stack and ephemeral volumes
    cmds:
      - docker compose --env-file {{.ENV_TEST}} {{.COMPOSE_TEST}} down -v

  docker:test:logs:
    desc: Stream test stack logs
    cmds:
      - docker compose --env-file {{.ENV_TEST}} {{.COMPOSE_TEST}} logs -f

  # Docker: Staging Environment
  docker:staging:up:
    desc: Spin up staging stack (nginx, app, postgres, redis, monitoring)
    cmds:
      - docker compose --env-file {{.ENV_STAGING}} {{.COMPOSE_STAGING}} up -d --build

  docker:staging:down:
    desc: Tear down staging stack
    cmds:
      - docker compose --env-file {{.ENV_STAGING}} {{.COMPOSE_STAGING}} down

  docker:staging:logs:
    desc: Stream staging app logs
    cmds:
      - docker compose --env-file {{.ENV_STAGING}} {{.COMPOSE_STAGING}} logs -f app

  # Docker: Production Environment
  docker:prod:up:
    desc: Spin up production stack (nginx, app, postgres, redis)
    cmds:
      - docker compose --env-file {{.ENV_PROD}} {{.COMPOSE_PROD}} up -d --build

  docker:prod:down:
    desc: Tear down production stack
    cmds:
      - docker compose --env-file {{.ENV_PROD}} {{.COMPOSE_PROD}} down

  docker:prod:logs:
    desc: Stream production app logs
    cmds:
      - docker compose --env-file {{.ENV_PROD}} {{.COMPOSE_PROD}} logs -f app

  # Dedicated Infrastructure Services
  dev-deps:
    desc: Spin up backing dev dependencies (postgres, redis, minio) in Docker
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} up -d postgres redis minio minio-init

  db:up:
    desc: Start development PostgreSQL container only
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} up -d postgres

  db:down:
    desc: Stop development PostgreSQL container
    cmds:
      - docker compose {{.COMPOSE_DEV}} stop postgres

  redis:up:
    desc: Start development Redis container only
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} up -d redis

  redis:down:
    desc: Stop development Redis container
    cmds:
      - docker compose {{.COMPOSE_DEV}} stop redis

  redis:cli:
    desc: Connect to redis-cli in dev container
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} exec redis redis-cli

  redis:flush:
    desc: Flush all Redis keys in development container
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} exec redis redis-cli FLUSHALL

  minio:up:
    desc: Start development MinIO S3 object storage container only
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} up -d minio minio-init

  minio:down:
    desc: Stop development MinIO S3 storage container
    cmds:
      - docker compose {{.COMPOSE_DEV}} stop minio minio-init

  logs:minio:
    desc: Stream MinIO development logs
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} logs -f minio

  logs:prometheus:
    desc: Stream Prometheus development logs
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} logs -f prometheus

  # Migrations
  typeorm:migration:run:
    desc: Run pending TypeORM migrations
    cmds:
      - npm run typeorm:migration:run

  typeorm:migration:revert:
    desc: Revert last TypeORM migration
    cmds:
      - npm run typeorm:migration:revert

  typeorm:migration:generate:
    desc: Generate a new TypeORM migration based on entity diffs
    cmds:
      - npm run typeorm:migration:generate

  typeorm:migration:create:
    desc: Create an empty TypeORM migration file
    cmds:
      - npm run typeorm:migration:create

  # Comprehensive Teardown
  prune:
    desc: Prune dangling docker resources and volumes
    cmds:
      - docker system prune -f
      - docker volume prune -f

  reset:
    desc: Full reset and recreate development stack
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} down -v
      - docker system prune -f
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} up -d --build

  down:
    desc: Terminate all running docker resources across all environments
    cmds:
      - docker compose --env-file {{.ENV_DEV}} {{.COMPOSE_DEV}} down
      - docker compose --env-file {{.ENV_TEST}} {{.COMPOSE_TEST}} down
      - docker compose --env-file {{.ENV_STAGING}} {{.COMPOSE_STAGING}} down
      - docker compose --env-file {{.ENV_PROD}} {{.COMPOSE_PROD}} down
