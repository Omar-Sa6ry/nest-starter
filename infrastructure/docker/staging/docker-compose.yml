name: nest-starter-staging

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: starter-staging-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8082}:80"
    volumes:
      - ../common/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../common/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/staging/Dockerfile
    container_name: starter-staging-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      NODE_ENV: staging
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${DB_NAME:-nest_starter_staging}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8082}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  postgres:
    image: postgres:15-alpine
    container_name: starter-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-nest_starter_staging}
    ports:
      - "127.0.0.1:${DB_PORT:-5436}:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME:-nest_starter_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: starter-staging-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  prometheus:
    image: prom/prometheus:latest
    container_name: starter-staging-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ../common/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    deploy:
      resources:
        limits:
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: starter-staging-alertmanager
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint.sh"]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://alertmanager-discord:8080/webhook}
    volumes:
      - ../common/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ../common/alertmanager/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - alertmanager_staging_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9094}:9093"
    depends_on:
      - alertmanager-discord
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  alertmanager-discord:
    build:
      context: ../common/discord-relay
    image: nest-starter/alertmanager-discord:local
    container_name: starter-staging-alertmanager-discord
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_USERNAME: ${DISCORD_USERNAME:-Nest Starter Alerts}
      PORT: "8080"
    ports:
      - "127.0.0.1:${ALERTMANAGER_DISCORD_PORT:-8083}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  # NATS Message Broker
  nats:
    image: nats:2-alpine
    container_name: starter-staging-nats
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NATS_PORT:-4223}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8223}:8222"
    command: ["--jetstream", "--store_dir", "/data"]
    volumes:
      - nats_staging_data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: starter-staging-rabbitmq
    restart: unless-stopped
    hostname: rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_staging_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_staging_data:
  redis_staging_data:
  alertmanager_staging_data:
  nats_staging_data:
  rabbitmq_staging_data:
