name: nest-starter-prod

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: starter-prod-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ../common/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../common/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro  # Uncomment for SSL
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/production/Dockerfile
    container_name: starter-prod-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${DB_NAME:-nest_starter_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://api.example.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  postgres:
    image: postgres:15-alpine
    container_name: starter-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-nest_starter_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME:-nest_starter_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: starter-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  prometheus:
    image: prom/prometheus:latest
    container_name: starter-prod-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9092}:9090"
    volumes:
      - ../common/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    deploy:
      resources:
        limits:
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint.sh"]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ../common/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ../common/alertmanager/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - alertmanager_prod_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9095}:9093"
    depends_on:
      - alertmanager-discord
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  alertmanager-discord:
    build:
      context: ../common/discord-relay
    image: nest-starter/alertmanager-discord:local
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_USERNAME: ${DISCORD_USERNAME:-Nest Starter Alerts}
      PORT: "8080"
    ports:
      - "127.0.0.1:${ALERTMANAGER_DISCORD_PORT:-8084}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  # # NATS Message Broker
