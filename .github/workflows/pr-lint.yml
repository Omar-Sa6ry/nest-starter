name: PR Quality & Automated Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-lint:
    name: Validate PR Title & Structure
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits / PR Title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional commits prefixes (feat, fix, docs, chore, etc.)
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  labeler:
    name: Auto Label PR
    runs-on: ubuntu-latest
    steps:
      - name: Check files changed & auto-comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            console.log(`PR #${pr.number} updated by @${pr.user.login}`);

